# =============================================================================
# AWS EC2 Dynamic Inventory
# =============================================================================
#
# Q: What is this file?
#
# A:
# This file tells Ansible how to discover EC2 instances from AWS dynamically
# instead of maintaining a static inventory.
#
# Q: What happens when I run:
#
#   ansible-inventory --graph
#
# A:
#
# ansible-inventory
#        │
#        ▼
# Read aws_ec2.yml
#        │
#        ▼
# Load amazon.aws.aws_ec2 Inventory Plugin
#        │
#        ▼
# Use the Controller EC2 IAM Role
#        │
#        ▼
# Call AWS DescribeInstances API
#        │
#        ▼
# AWS returns EC2 metadata
#        │
#        ▼
# Build the Ansible Inventory
#
# Note:
# The plugin is part of the amazon.aws collection and uses the Controller's
# IAM Role permissions (ec2:DescribeInstances, ec2:DescribeTags, etc.)
# to discover EC2 instances.
# =============================================================================

plugin: amazon.aws.aws_ec2

# =============================================================================
# Q: Why do we specify regions?
#
# A:
# The plugin only searches the AWS regions listed below.
#
# Example:
# regions:
#   - us-west-2
#
# Result:
# Only EC2 instances in us-west-2 are discovered.
# =============================================================================

regions:
  - us-west-2

# =============================================================================
# Q: Why use filters?
#
# A:
# Filters tell AWS which EC2 instances should be returned.
#
# Example:
#
# tag:AnsibleManaged = true
# instance-state-name = running
#
# Result:
# Only running EC2 instances with the AnsibleManaged=true tag
# are included in the inventory.
# =============================================================================

filters:
  tag:AnsibleManaged: "true"
  instance-state-name: running

# =============================================================================
# Q: How does Ansible know the hostname?
#
# A:
# AWS returns EC2 metadata including tags.
#
# Example:
#
# Name = worker-1
#
# hostnames:
#   - tag:Name
#
# Result:
# The Name tag becomes the Ansible hostname.
# =============================================================================

hostnames:
  - tag:Name

compose:
  ansible_host: instance_id
  
# =============================================================================
# Q: What does keyed_groups do?
#
# A:
# Creates dynamic groups using EC2 metadata already returned by AWS.
#
# Example:
#
# AWS Tag:
# Role = web
#
# Configuration:
#
# key: tags.Role
# prefix: role
#
# Result:
#
# role_web
# └── worker-1
#
# If another EC2 also has Role=web:
#
# role_web
# ├── worker-1
# └── api-1
#
# Ansible simply reuses the existing group.
# =============================================================================

keyed_groups:
  - key: ec2_tags.Role
    prefix: role

  - key: ec2_tags.Environment
    prefix: env

# =============================================================================
# Example: How AWS Metadata becomes the Ansible Inventory
#
# AWS returns:
#
# Name                 Role         Environment
# ------------------------------------------------
# worker-1             web          dev
# ansible-controller   controller   dev
#
# Step 1:
# hostnames uses the Name tag.
#
# Hosts:
# - worker-1
# - ansible-controller
#
# Step 2:
# The aws_ec2 plugin automatically places every discovered host
# into the @aws_ec2 group.
#
# Step 3:
# keyed_groups creates additional groups:
#
# role_web
# └── worker-1
#
# role_controller
# └── ansible-controller
#
# env_dev
# ├── worker-1
# └── ansible-controller
#
# Final Inventory:
#
# @all
# ├── @aws_ec2
# ├── @role_web
# ├── @role_controller
# └── @env_dev
#
# A host can belong to multiple groups at the same time.
# =============================================================================
